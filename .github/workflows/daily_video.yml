name: Daily YouTube Shorts Generator

on:
  schedule:
    - cron: '0 10 * * *' # Runs daily at 10 AM UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create environment files from Secrets
      run: |
        echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
        echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
        echo "UPLOAD_ENABLED=True" >> .env
        echo "${{ secrets.CLIENT_SECRETS_JSON }}" > client_secrets.json
        echo "${{ secrets.TOKEN_JSON }}" > token.json

    - name: Run Video Generator
      run: python main.py

    - name: Update Token Secret (if changed)
      if: always()
      run: |
        # If the token was refreshed, we'd ideally want to save it back to secrets.
        # This is complex in GH Actions, but often the refresh token remains valid.
        echo "Check logs for any re-auth requirements."
